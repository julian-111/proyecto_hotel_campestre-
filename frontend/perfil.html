<!DOCTYPE html>
<html lang="es" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Perfil | Bruma Viva</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="./assets/css/styles.css" />
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'sans-serif'] },
          colors: {
            brand: { orchid: '#8b5cf6', sky: '#0ea5e9', forest: '#10b981', sunset: '#f43f5e' }
          }
        }
      }
    }
  </script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
    body { font-family: 'Inter', sans-serif; background-color: #020617; color: #f8fafc; }
    .glass { background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1); }
    .ring-focus:focus-within { outline: none; box-shadow: 0 0 0 2px rgba(16, 185, 129, 0.4); }
  </style>
</head>
<body class="min-h-screen flex flex-col relative overflow-x-hidden selection:bg-emerald-500/30">
  <!-- Fondo Base -->
  <div class="fixed inset-0 -z-10" style="background: radial-gradient(circle at 15% 50%, rgba(var(--brand-orchid), 0.08), transparent 50%), radial-gradient(circle at 85% 30%, rgba(var(--brand-sky), 0.08), transparent 50%), radial-gradient(circle at 50% 80%, rgba(var(--brand-forest), 0.08), transparent 50%);"></div>

  <!-- Header -->
  <header class="fixed w-full top-0 z-50 glass border-b-0 border-white/5">
    <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
      <a href="./index.html" class="flex items-center gap-3 group">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-emerald-400 to-emerald-600 flex items-center justify-center text-white font-black text-xl shadow-lg shadow-emerald-500/20 group-hover:scale-105 transition-transform">B</div>
        <span class="font-bold text-xl tracking-tight text-white">Bruma Viva</span>
      </a>
      <nav class="hidden md:flex items-center gap-8">
        <a href="./index.html" class="text-sm font-medium text-slate-300 hover:text-white transition-colors">Inicio</a>
        <a href="./habitaciones.html" class="text-sm font-medium text-slate-300 hover:text-white transition-colors">Habitaciones</a>
        <a href="./mis-citas.html" class="text-sm font-medium text-slate-300 hover:text-white transition-colors">Mis Citas</a>
        <div class="h-4 w-px bg-white/10"></div>
        <button id="btn-logout" class="text-sm font-medium text-rose-400 hover:text-rose-300 transition-colors">Cerrar Sesión</button>
      </nav>
      <button class="md:hidden text-white" id="mobile-menu-btn">
        <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
      </button>
    </div>
  </header>

  <!-- Contenido Principal -->
  <main class="flex-1 pt-32 pb-20 px-6">
    <div class="max-w-3xl mx-auto">
      
      <div class="mb-8">
        <h1 class="text-3xl md:text-4xl font-black text-white">Mi Perfil</h1>
        <p class="text-slate-400 mt-2">Gestiona tu información personal y los ajustes de tu cuenta.</p>
      </div>

      <!-- Tarjeta de Perfil -->
      <div class="glass rounded-3xl p-6 md:p-8 relative overflow-hidden">
        <!-- Decoración -->
        <div class="absolute top-0 right-0 w-64 h-64 bg-emerald-500/10 rounded-full blur-3xl -translate-y-1/2 translate-x-1/2 pointer-events-none"></div>

        <form id="perfil-form" class="relative space-y-6">
          <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <!-- Nombre -->
            <div class="space-y-2">
              <label class="text-sm font-medium text-slate-300">Nombre Completo</label>
              <input type="text" id="perfil-nombre" name="nombre" required class="w-full rounded-xl px-4 py-3 bg-black/20 border border-white/10 text-white ring-focus transition-colors focus:border-emerald-500/50" placeholder="Tu nombre">
            </div>

            <!-- Correo (Solo lectura o editable según tu backend) -->
            <div class="space-y-2">
              <label class="text-sm font-medium text-slate-300">Correo Electrónico</label>
              <input type="email" id="perfil-correo" name="correo" required class="w-full rounded-xl px-4 py-3 bg-black/40 border border-white/5 text-slate-400 cursor-not-allowed" readonly title="El correo no se puede cambiar">
            </div>

            <!-- Teléfono (Nuevo campo común en perfiles) -->
            <div class="space-y-2">
              <label class="text-sm font-medium text-slate-300">Teléfono (Opcional)</label>
              <input type="tel" id="perfil-telefono" name="telefono" class="w-full rounded-xl px-4 py-3 bg-black/20 border border-white/10 text-white ring-focus transition-colors focus:border-emerald-500/50" placeholder="+57 300 000 0000">
            </div>

            <!-- Nueva Contraseña -->
            <div class="space-y-2">
              <label class="text-sm font-medium text-slate-300">Nueva Contraseña (Opcional)</label>
              <input type="password" id="perfil-password" name="contrasena" class="w-full rounded-xl px-4 py-3 bg-black/20 border border-white/10 text-white ring-focus transition-colors focus:border-emerald-500/50" placeholder="••••••••">
              <p class="text-xs text-slate-500">Déjalo en blanco si no deseas cambiarla.</p>
            </div>
          </div>

          <div class="pt-4 flex items-center justify-between border-t border-white/10">
            <button type="button" id="btn-delete-account" class="text-sm font-medium text-rose-400 hover:text-rose-300 px-4 py-2 rounded-xl hover:bg-rose-500/10 transition-colors">
              Dar de baja mi cuenta
            </button>
            <button type="submit" id="btn-save-profile" class="ring-focus bg-emerald-500 hover:bg-emerald-400 text-white font-semibold rounded-xl px-6 py-3 transition-colors shadow-lg shadow-emerald-500/20 flex items-center gap-2">
              Guardar Cambios
            </button>
          </div>
        </form>
      </div>

    </div>
  </main>

  <!-- Notificaciones Toast -->
  <div id="toast" class="toast">
    <div class="glass rounded-2xl p-4">
      <div class="flex items-start justify-between gap-3">
        <div>
          <div data-toast-title class="text-white font-semibold">Listo</div>
          <div data-toast-msg class="text-sm text-slate-200/70">Mensaje</div>
        </div>
        <button data-toast-close class="ring-focus bg-slate-800 hover:bg-slate-700 rounded-xl px-3 py-2 text-xs text-slate-100/90 transition-all" type="button">
          Cerrar
        </button>
      </div>
    </div>
  </div>

  <!-- Lógica -->
  <script src="./assets/js/main.js?v=2.3" defer></script>
</body>
</html>
